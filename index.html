    <!-- 1. Immediate Zombie Service Worker & Cache Purge -->
    <script>
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            }).catch(function() {});
          }
        } catch(e) {}
      })();
    </script>

    <!-- 2. Immediate Error Trap to prevent permanent blank white screen -->
    <script>
      window.addEventListener('error', function(e) {
        // Suppress browser extension spam
        if (e && e.message && /chrome-extension:|moz-extension:|inpage\.js|metamask/i.test(e.message)) {
          e.stopImmediatePropagation();
          return;
        }
        var placeholder = document.getElementById('loading-placeholder');
        if (placeholder) {
          placeholder.innerHTML = 
            '<div style="max-width: 480px; padding: 24px; background: rgba(15, 23, 42, 0.9); border: 1px solid #ef4444; border-radius: 12px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">' +
              '<div style="font-size: 16px; font-weight: bold; color: #f87171; margin-bottom: 8px;">起動エラーを検知しました</div>' +
              '<div style="font-size: 12px; color: #94a3b8; margin-bottom: 12px; line-height: 1.5;">ブラウザのキャッシュまたは古い拡張機能の通信により読み込みが中断された可能性があります。</div>' +
              '<div style="font-family: monospace; font-size: 11px; background: #020617; padding: 10px; border-radius: 6px; border: 1px solid #334155; word-break: break-all; color: #fca5a5; margin-bottom: 16px; text-align: left;">' +
                (e.message || 'Script error') +
              '</div>' +
              '<div style="display: flex; gap: 8px; justify-content: center;">' +
                '<button onclick="window.location.reload();" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">再読み込み</button>' +
                '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(ex){}window.location.reload();" style="padding: 8px 16px; background: #334155; color: #e2e8f0; border: none; border-radius: 6px; font-size: 12px; cursor: pointer;">キャッシュ初期化</button>' +
              '</div>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason && (e.reason.message || String(e.reason)));
        if (reason && /chrome-extension:|moz-extension:|inpage\.js|metamask/i.test(reason)) {
          e.stopImmediatePropagation();
        }
      });
    </script>
